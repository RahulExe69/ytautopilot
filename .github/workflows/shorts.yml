name: ytautopilot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run generates JSON only; prepare also renders a reviewable Short"
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - prepare
      topic:
        description: "Gaming topic for this run"
        type: string
        required: true
        default: "Free Fire tips and lesser-known facts"

permissions:
  contents: read

concurrency:
  group: ytautopilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg and Devanagari font only if missing
        shell: bash
        run: |
          missing=0
          command -v ffmpeg >/dev/null 2>&1 || missing=1
          command -v ffprobe >/dev/null 2>&1 || missing=1
          command -v espeak-ng >/dev/null 2>&1 || missing=1
          if ! fc-match "Noto Sans Devanagari" 2>/dev/null | grep -qi "Noto Sans Devanagari"; then
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg fonts-noto-core espeak-ng espeak-ng-data libespeak-ng1
          else
            echo "FFmpeg, ffprobe, and Devanagari font already available; skipping apt install."
          fi

      - name: Install CPU-only PyTorch first
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.0"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Verify IndicVoice runtime dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          import spacy
          import torch
          from phonemizer.backend.espeak.wrapper import EspeakWrapper
          import indicvoice

          candidates = [
              Path("/usr/lib/x86_64-linux-gnu/libespeak-ng.so.1"),
              Path("/usr/lib/aarch64-linux-gnu/libespeak-ng.so.1"),
              Path("/usr/lib64/libespeak-ng.so.1"),
          ]
          library = next((path for path in candidates if path.is_file()), None)
          if library is None:
              raise SystemExit("System eSpeak-NG shared library not found")

          data_candidates = [
              Path("/usr/lib/x86_64-linux-gnu/espeak-ng-data"),
              Path("/usr/lib/aarch64-linux-gnu/espeak-ng-data"),
              Path("/usr/lib/arm-linux-gnueabihf/espeak-ng-data"),
              Path("/usr/share/espeak-ng-data"),
          ]
          data_path = next((path for path in data_candidates if path.is_dir()), None)
          if data_path is None:
              raise SystemExit("System eSpeak-NG data directory not found")

          EspeakWrapper.set_library(str(library))
          if hasattr(EspeakWrapper, "set_data_path"):
              EspeakWrapper.set_data_path(str(data_path))

          from phonemizer.backend import EspeakBackend
          backend = EspeakBackend(language="hi")
          print("espeak_test=", backend.phonemize(["नमस्ते"], strip=True))

          print(f"spaCy={spacy.__version__}")
          print(f"torch={torch.__version__}")
          print(f"cuda_available={torch.cuda.is_available()}")
          print(f"indicvoice={indicvoice.__file__}")
          print(f"espeak_library={library}")
          print(f"espeak_data={data_path}")
          PY

      - name: Cache IndicVoice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: indicvoice-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            indicvoice-${{ runner.os }}-

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          INDICVOICE_VOICE: ${{ vars.INDICVOICE_VOICE }}
          INDICVOICE_MODEL: ${{ vars.INDICVOICE_MODEL }}
          INCLUDE_HOOK_IN_NARRATION: "true"
          ENABLE_PUBLISH: ${{ vars.ENABLE_PUBLISH }}
          PYTHONPATH: src
        run: |
          python -m ytautopilot --mode "${{ inputs.mode }}" --topic "${{ inputs.topic }}"

      - name: Upload generated output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ytautopilot-output-${{ github.run_number }}
          path: output/
          if-no-files-found: ignore
          retention-days: 7
