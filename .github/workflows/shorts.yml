name: ytautopilot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run generates JSON only; prepare renders a reviewable Short; publish uploads it privately"
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - prepare
          - publish
      topic:
        description: "Gaming topic for this run"
        type: string
        required: true
        default: "auto"

  schedule:
    - cron: "0 12 * * *"
      timezone: "Asia/Kolkata"
    - cron: "30 19 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: ytautopilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      HF_HOME: ~/.cache/huggingface
      HF_HUB_CACHE: ~/.cache/huggingface/hub
      HF_XET_NUM_CONCURRENT_RANGE_GETS: "32"
      YTAP_FAST_MODE: "1"
      SCENE_FRAME_SKIP: "1"
      CROPDETECT_FRAMES: "48"
      SCENE_WORKERS: "2"
      TORCH_NUM_THREADS: "0"
      FFMPEG_PRESET: "ultrafast"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore warm Python environment
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-ubuntu-24.04-py3.11-${{ hashFiles('requirements.txt') }}

      - name: Create or restore Python environment
        shell: bash
        run: |
          if [ ! -x .venv/bin/python ] || ! .venv/bin/python -c 'import sys; print(sys.version)' >/dev/null 2>&1; then
            rm -rf .venv
            python -m venv .venv
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.0"
            .venv/bin/python -m pip install -r requirements.txt
          else
            echo "Warm .venv cache hit; skipping dependency installation."
          fi
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Configure CPU threading
        shell: bash
        run: |
          threads="${TORCH_NUM_THREADS}"
          if [ "$threads" = "0" ]; then
            threads="$(nproc)"
          fi
          echo "OMP_NUM_THREADS=$threads" >> "$GITHUB_ENV"
          echo "MKL_NUM_THREADS=$threads" >> "$GITHUB_ENV"
          echo "OPENBLAS_NUM_THREADS=$threads" >> "$GITHUB_ENV"
          echo "TORCH_NUM_THREADS=$threads" >> "$GITHUB_ENV"
          echo "FFMPEG_THREADS=$threads" >> "$GITHUB_ENV"
          echo "CPU threads: $threads"
      - name: Cache IndicVoice model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: indicvoice-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            indicvoice-${{ runner.os }}-

      - name: Set pipeline and publishing context
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "PIPELINE_MODE=publish" >> "$GITHUB_ENV"
            echo "PIPELINE_TOPIC=auto" >> "$GITHUB_ENV"

            if [ "${{ github.event.schedule }}" = "0 12 * * *" ]; then
              publish_at="$(PYTHONPATH=src python -c 'from ytautopilot.scheduler import scheduled_publish_at; print(scheduled_publish_at("midday"))')"
              echo "PUBLISH_SLOT=midday" >> "$GITHUB_ENV"
            else
              publish_at="$(PYTHONPATH=src python -c 'from ytautopilot.scheduler import scheduled_publish_at; print(scheduled_publish_at("evening"))')"
              echo "PUBLISH_SLOT=evening" >> "$GITHUB_ENV"
            fi

            echo "YOUTUBE_PUBLISH_AT=$publish_at" >> "$GITHUB_ENV"
            echo "Scheduled YouTube publish target: $publish_at"
          else
            echo "PIPELINE_MODE=${{ inputs.mode }}" >> "$GITHUB_ENV"
            echo "PIPELINE_TOPIC=${{ inputs.topic }}" >> "$GITHUB_ENV"
            echo "PUBLISH_SLOT=manual" >> "$GITHUB_ENV"
            echo "YOUTUBE_PUBLISH_AT=" >> "$GITHUB_ENV"
          fi

      - name: Verify YouTube OAuth scopes before publishing
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'publish' }}
        env:
          YOUTUBE_CLIENT_ID: ${{secrets.YOUTUBE_CLIENT_ID}}
          YOUTUBE_CLIENT_SECRET: ${{secrets.YOUTUBE_CLIENT_SECRET}}
          YOUTUBE_REFRESH_TOKEN: ${{secrets.YOUTUBE_REFRESH_TOKEN}}
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from ytautopilot.youtube_upload import _credentials, REQUIRED_SCOPES

          credentials = _credentials()
          granted = sorted(str(scope) for scope in (credentials.granted_scopes or []))
          print("YouTube OAuth scope check passed.")
          print("Required scopes present:", credentials.has_scopes(REQUIRED_SCOPES))
          print("Granted scopes:", granted)
          PY

      - name: Update performance learning profile
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'publish' }}
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PYTHONPATH: src
        run: python -m ytautopilot.analytics

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          INDICVOICE_VOICE: hf_beta
          INDICVOICE_MODEL: ${{ vars.INDICVOICE_MODEL }}
          INDICVOICE_SPEED: "1.28"
          INDICVOICE_VOICE_FALLBACK_REPO: "hexgrad/Kokoro-82M"
          INCLUDE_HOOK_IN_NARRATION: "true"
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PUBLISH_ENABLED: "true"
          PYTHONPATH: src
        run: |
          python -m ytautopilot --mode "$PIPELINE_MODE" --topic "$PIPELINE_TOPIC"

      - name: Persist generation and learning state
        if: ${{ always() && (github.event_name == 'schedule' || inputs.mode == 'prepare' || inputs.mode == 'publish') }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/content_history.json data/upload_history.json data/media_history.json data/performance_history.json data/strategy_profile.json data/description_history.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: persist ytautopilot generation and learning state"
            # A workflow can finish after another legitimate repo commit lands
            # on main (for example while a manual run is in progress). Rebase
            # the small state commit onto the current main before pushing so a
            # harmless concurrent commit does not turn a successful upload into
            # a failed workflow.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Upload generated output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ytautopilot-output-${{ github.run_number }}
          path: output/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
