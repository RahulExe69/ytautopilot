name: ytautopilot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run generates JSON only; prepare also renders a reviewable Short"
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - prepare
      topic:
        description: "Gaming topic for this run"
        type: string
        required: true
        default: "Free Fire tips and lesser-known facts"

permissions:
  contents: read

concurrency:
  group: ytautopilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg and Devanagari font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          EDGE_TTS_VOICE: ${{ vars.EDGE_TTS_VOICE }}
          EDGE_TTS_RATE: ${{ vars.EDGE_TTS_RATE }}
          INCLUDE_HOOK_IN_NARRATION: "true"
          ENABLE_PUBLISH: ${{ vars.ENABLE_PUBLISH }}
          PYTHONPATH: src
        run: |
          python -m ytautopilot --mode "${{ inputs.mode }}" --topic "${{ inputs.topic }}"

      - name: Upload generated output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ytautopilot-output-${{ github.run_number }}
          path: output/
          if-no-files-found: ignore
          retention-days: 7
